services:
  postgres:
    image: postgres:16-alpine
    container_name: aua_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aua_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aua_secure_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-aua_chat_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aua_user} -d ${POSTGRES_DB:-aua_chat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: aua_telegram_bot_api
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aua_bot
    restart: always
    env_file:
      - path: .env
        required: false

    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aua_cloudflare_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bot
      - drop_proxy

  drop_proxy:
    build:
      context: ./drop_proxy
      dockerfile: Dockerfile
    container_name: aua_drop_proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    environment:
      - DROP_BACKEND_UPSTREAM=bot:8000
      - DROP_INTERNAL_PROXY_SECRET=${DROP_INTERNAL_PROXY_SECRET:-}
      - DROP_ONION_HOSTNAME=${DROP_ONION_HOSTNAME:-}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - bot

  tor_drop:
    build:
      context: ./tor
      dockerfile: Dockerfile
    container_name: aua_tor_drop
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    volumes:
      - tor_drop_data:/var/lib/tor
    depends_on:
      - drop_proxy

volumes:
  postgres_data:
    name: aua_postgres_data
  telegram_api_data:
    name: aua_telegram_api_data
  tor_drop_data:
    name: aua_tor_drop_data
